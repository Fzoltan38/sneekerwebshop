<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SneekerWebShop - Sportcipők</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="topbar">
        <div class="container topbar-inner">
            <a href="index.html" class="logo">Sneeker<span>WebShop</span></a>
            <button class="menu-toggle" id="menuGomb" aria-label="Menü">&#9776;</button>
            <nav id="fomenu">
                <a href="index.html">Cipők</a>
                <a href="cart.html">Kosár <span class="badge" id="kosarSzam">0</span></a>
                <a href="orders.html" data-lathato="tag">Rendeléseim</a>
                <a href="admin.html" data-lathato="admin">Admin</a>
                <span class="user-label" id="felhasznaloNev" data-lathato="tag"></span>
                <a href="login.html" data-lathato="vendeg">Belépés</a>
                <a href="register.html" data-lathato="vendeg">Regisztráció</a>
                <a href="#" id="kilepGomb" data-lathato="tag">Kilépés</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <div id="uzenet" class="uzenet rejtett"></div>

        <div class="oldal-fejlec">
            <h1>Sportcipő kínálatunk</h1>
            <p>Böngéssz a cipők között regisztráció nélkül is. A vásárláshoz jelentkezz be.</p>
        </div>

        <div class="szuro">
            <input type="text" id="kereso" placeholder="Keresés név vagy leírás alapján...">
            <select id="markaSzuro">
                <option value="">Összes márka</option>
            </select>
            <button class="gomb" id="szuresGomb">Keresés</button>
            <button class="gomb gomb-masodlagos" id="torlesGomb">Szűrő törlése</button>
        </div>

        <div class="kartyak" id="termekLista"></div>

    </main>

    <footer>
        <div class="container">SneekerWebShop &copy; 2026 - vizsgaremek projekt</div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
</body>

</html>
